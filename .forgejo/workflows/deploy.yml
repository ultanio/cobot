name: Deploy Alpha

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: python-3.12
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_PUBKEY: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_PUBKEY" > ~/.ssh/known_hosts

      - name: Sync deploy script to Alpha
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          scp -i ~/.ssh/deploy_key scripts/deploy-alpha.sh "$DEPLOY_USER@$DEPLOY_HOST:~/workspace/cobot/scripts/deploy-alpha.sh"

      - name: Deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/workspace/cobot/scripts/deploy-alpha.sh forgejo"

      - name: Cleanup
        if: always()
        run: rm -f ~/.ssh/deploy_key

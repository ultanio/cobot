name: Deploy Alpha

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: python-3.12
    if: github.repository == 'ultanio/cobot'
    steps:
      - name: Validate secrets
        run: |
          errors=0
          [ -z "$DEPLOY_HOST" ] && echo "::error::DEPLOY_HOST missing" && errors=$((errors+1))
          [ -z "$DEPLOY_USER" ] && echo "::error::DEPLOY_USER missing" && errors=$((errors+1))
          [ -z "$DEPLOY_SSH_KEY" ] && echo "::error::DEPLOY_SSH_KEY missing" && errors=$((errors+1))
          [ -z "$DEPLOY_HOST_FINGERPRINT" ] && echo "::error::DEPLOY_HOST_FINGERPRINT missing" && errors=$((errors+1))
          [ $errors -gt 0 ] && exit 1
          echo "✓ All secrets present"
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_FINGERPRINT: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}

      - name: Deploy to Alpha
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
          script: echo "deploy triggered"

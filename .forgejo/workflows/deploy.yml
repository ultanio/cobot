name: Deploy Alpha

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: python-3.12
    steps:
      - name: Deploy to Alpha via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_PUBKEY: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          set -euo pipefail

          # Validate secrets
          for var in DEPLOY_HOST DEPLOY_USER DEPLOY_SSH_KEY DEPLOY_HOST_PUBKEY; do
            if [ -z "${!var}" ]; then
              echo "::error::Missing secret: $var"
              exit 1
            fi
          done

          # Setup SSH
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_PUBKEY" >> ~/.ssh/known_hosts

          # SSH triggers forced command (deploy script) via authorized_keys
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=yes \
            "$DEPLOY_USER@$DEPLOY_HOST"

          rm -f ~/.ssh/deploy_key

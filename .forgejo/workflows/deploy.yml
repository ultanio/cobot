name: Deploy Alpha

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: python-3.12
    steps:
      - name: Deploy via SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_HOST_PUBKEY: ${{ secrets.DEPLOY_HOST_FINGERPRINT }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          echo "$DEPLOY_HOST $DEPLOY_HOST_PUBKEY" > ~/.ssh/known_hosts
          ssh -v -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "echo deploy"
          rm -f ~/.ssh/deploy_key

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: python-3.12

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: |
          uv venv
          uv pip install -e ".[all]"

      - name: Run tests
        run: |
          . .venv/bin/activate
          pytest -v --tb=short

  lint:
    runs-on: python-3.12

    steps:
      - uses: actions/checkout@v4

      - name: Install ruff
        run: pip install ruff

      - name: Lint
        run: ruff check cobot/

      - name: Format check
        run: ruff format --check cobot/
